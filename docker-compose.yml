version: '3'

services:
  # Backend service
  backend:
    build: ./  # Assuming your backend is in the root directory
    ports:
      - "5001:5000"
    environment:
      - CONNECTION_URL=mongodb://mongodb:27017/test
      - PORT=5000
      - REFRESH_TOKEN_SECRET=REPO123
    depends_on:
      - mongodb
    restart: always

  # MongoDB service
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data: 